# =============================
# Server Configuration
# =============================
server.port=8080

# =============================
# MongoDB Configuration
# =============================
spring.data.mongodb.uri=your_mongodb_connection_string_here
spring.data.mongodb.database=courseplatform

# Show MongoDB queries in the console (for debugging)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# =============================
# Stripe Configuration
# =============================
stripe.api.key=your_stripe_secret_key_here

# =============================
# Spring Security (Optional for OAuth2)
# =============================
# You can add security-related properties if you use OAuth2 login or JWT.
# For example:
# spring.security.oauth2.client.registration.google.client-id=
# spring.security.oauth2.client.registration.google.client-secret=
